# Adapted from the rasusa and lrge CI. Linux and macOS both build and test, because the
# self-contained binary will embed native code whose portability has to be shown, not assumed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  licenses:
    name: licence notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned licence bundler
        run: cargo install cargo-bundle-licenses --version 4.2.0 --locked
      - name: Fetch sources for all locked targets
        run: cargo fetch --locked
      - name: Check redistribution notices
        run: python3 scripts/bundle_licenses.py --check

  conventional-commits:
    runs-on: ubuntu-latest
    name: conventional commit compliance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # `cog check --from-latest-tag` exits 1 with "unable to get any tag" until the first release
      # exists, and the action hides that message. Until then check the whole history, which is
      # the same rule over every commit.
      - name: Choose the commit range
        id: range
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            echo "args=--from-latest-tag" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: ${{ steps.range.outputs.args }}

  test:
    name: test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - name: Install GNU C++ on macOS
        if: runner.os == 'macOS'
        run: |
          brew install gcc
      # Cache downloads only: archiving native debug/release builds can exhaust runner disk.
      - uses: actions/cache@v6
        if: runner.os != 'macOS'
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-sources-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-v1-
      - name: Run the tests
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            export CARGO_TARGET_DIR="$RUNNER_TEMP/pterobacter-fresh-native"
          fi
          if [ "${{ runner.os }}" = macOS ]; then
            python3 scripts/without_cxx_overrides.py just test
          else
            just test
          fi
          cargo test --locked -p skani --lib
          cargo test --locked -p partitions
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/target}" cargo test --manifest-path vendor/partitions/Cargo.toml --features compact
      - name: Check what a default install exposes
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            export CARGO_TARGET_DIR="$RUNNER_TEMP/pterobacter-fresh-native"
          fi
          if [ "${{ runner.os }}" = macOS ]; then
            python3 scripts/without_cxx_overrides.py just install-check
          else
            just install-check
          fi
      - name: Reject blank compiler overrides through Cargo
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            export CARGO_TARGET_DIR="$RUNNER_TEMP/pterobacter-fresh-native"
            compiler=$(find "$(brew --prefix gcc)/bin" -name 'g++-[0-9]*' | head -n 1)
          else
            compiler=$(command -v g++)
          fi
          python3 scripts/check_blank_compilers.py --compiler "$compiler"
      - name: Check explicit GNU C++ overrides on macOS
        if: runner.os == 'macOS'
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pterobacter-fresh-native"
          compiler=$(find "$(brew --prefix gcc)/bin" -name 'g++-[0-9]*' | head -n 1)
          test -n "$compiler"
          target=$(rustc -vV | sed -n 's/^host: //p')
          # Target-specific override wins over invalid HOST_CXX and CXX.
          python3 scripts/without_cxx_overrides.py env "CXX_$target=$compiler" HOST_CXX=/missing/gnu-cxx CXX=clang++ cargo check --locked
          # A lower-priority explicit Clang/missing override must not trigger discovery.
          for invalid in clang++ /missing/gnu-cxx; do
            if python3 scripts/without_cxx_overrides.py env CXX="$invalid" cargo check --locked > override-error.log 2>&1; then
              echo "invalid explicit compiler unexpectedly succeeded" >&2
              exit 1
            fi
            cat override-error.log
            grep -E 'requires GNU C\+\+|Invalid GNU C\+\+ compiler' override-error.log
          done

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@just
      - run: just lint

  shear:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned dependency checker
        run: cargo install cargo-shear --version 1.14.0 --locked
      - run: cargo shear
