# Adapted from the rasusa and lrge CI. Linux and macOS both build and test, because the
# self-contained binary will embed native code whose portability has to be shown, not assumed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  licenses:
    name: licence notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned licence bundler
        run: cargo install cargo-bundle-licenses --version 4.2.0 --locked
      - name: Fetch sources for all locked targets
        run: cargo fetch --locked
      - name: Check redistribution notices
        run: python3 scripts/bundle_licenses.py --check

  conventional-commits:
    runs-on: ubuntu-latest
    name: conventional commit compliance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # `cog check --from-latest-tag` exits 1 with "unable to get any tag" until the first release
      # exists, and the action hides that message. Until then check the whole history, which is
      # the same rule over every commit.
      - name: Choose the commit range
        id: range
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            echo "args=--from-latest-tag" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: ${{ steps.range.outputs.args }}

  test:
    name: test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run the tests
        run: just test
      - name: Check what a default install exposes
        run: just install-check

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@just
      - run: just lint

  shear:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm cargo-shear
      - run: cargo shear
