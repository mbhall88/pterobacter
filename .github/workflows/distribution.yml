name: Distribution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag; blank prepares main without publishing
        type: string
        default: ''
      publish:
        description: Publish this approved tag to crates.io and attach verified release assets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.event_name }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0

jobs:
  source:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release identity and publication authorization
        id: identity
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            python3 scripts/check_release_tag.py --tag "$TAG" --publish > "$RUNNER_TEMP/identity.json"
          else
            python3 scripts/check_release_tag.py --tag "$TAG" > "$RUNNER_TEMP/identity.json"
          fi
          python3 - <<'PY'
          import json, os
          x = json.load(open(os.environ['RUNNER_TEMP'] + '/identity.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + x['version'] + '\ncommit=' + x['source_commit'] + '\n')
          PY
      - name: Prepare complete corresponding source
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          cargo fetch --locked
          mkdir "$RUNNER_TEMP/source-assets"
          python3 scripts/prepare_source_archive.py --staging-parent "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/source-assets/pterobacter-$VERSION-corresponding-source.tar.gz" \
            > "$RUNNER_TEMP/source-assets/source-receipt.json"
      - name: Rebuild corresponding source without a registry cache or network
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          TMPDIR: ${{ runner.temp }}
        run: python3 scripts/verify_source_distribution.py "$RUNNER_TEMP/source-assets/pterobacter-$VERSION-corresponding-source.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-source
          path: ${{ runner.temp }}/source-assets
          if-no-files-found: error

  binaries:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GNU C++ runtime and compiler on macOS
        if: runner.os == 'macOS'
        run: brew install gcc
      - name: Build and verify the Cargo package and installed binaries
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/distribution-target
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 -m unittest discover -s scripts -p test_distribution.py
          python3 -m unittest discover -s scripts -p test_release_assets.py
          python3 scripts/build_binary_distribution.py --target "$TARGET" --output "$RUNNER_TEMP/binary-assets"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/binary-assets
          if-no-files-found: error

  verify:
    needs: [source, binaries]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidates
      - name: Check all hashes and source identities
        env:
          VERSION: ${{ needs.source.outputs.version }}
          COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          python3 scripts/collect_release_assets.py --input "$RUNNER_TEMP/candidates" \
            --output "$RUNNER_TEMP/release-assets" --version "$VERSION" --commit "$COMMIT"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: [source, binaries, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Recheck the tag, source CI and tested crate
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_release_tag.py --tag "$TAG" --publish
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check SHA256SUMS)
          cargo package --locked --no-verify
          cmp "target/package/pterobacter-$VERSION.crate" "$RUNNER_TEMP/release-assets/pterobacter-$VERSION.crate"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
      - name: Publish the verified package and attach release assets
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_distribution.py --approved-publication --tag "$TAG" \
            --assets "$RUNNER_TEMP/release-assets" --repository "$GITHUB_REPOSITORY"
