name: Bioconda candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/bioconda/**'
      - '.github/workflows/bioconda.yml'

permissions:
  contents: read

concurrency:
  group: bioconda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-package:
    name: Conda ${{ matrix.subdir }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            subdir: linux-64
          - runner: ubuntu-24.04-arm
            subdir: linux-aarch64
          - runner: macos-15-intel
            subdir: osx-64
          - runner: macos-15
            subdir: osx-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: recipe-build
          python-version: '3.12'
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install build tools and verify native platform
        env:
          EXPECTED_SUBDIR: ${{ matrix.subdir }}
        run: |
          conda install --yes --override-channels -c conda-forge conda-build
          python -c 'import os; from conda.base.context import context; assert context.subdir == os.environ["EXPECTED_SUBDIR"], (context.subdir, os.environ["EXPECTED_SUBDIR"])'
          conda list --explicit > build-environment.txt
      - name: Build and test installed commands and native ANIm
        env:
          CONDA_BLD_PATH: ${{ runner.temp }}/conda-build
        run: |
          set -o pipefail
          conda-build --override-channels -c conda-forge -c bioconda \
            packaging/bioconda/pterobacter 2>&1 | tee conda-build.log
      - name: Retain build evidence and candidate packages
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bioconda-${{ matrix.subdir }}
          retention-days: 14
          path: |
            conda-build.log
            build-environment.txt
            ${{ runner.temp }}/conda-build/${{ matrix.subdir }}/pterobacter-*.conda
