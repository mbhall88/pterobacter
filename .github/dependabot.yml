version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Published skani databases use the bincode 1 format. v3 deliberately fails to compile.
      - dependency-name: bincode
        update-types: [version-update:semver-major]
