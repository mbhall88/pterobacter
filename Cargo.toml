[package]
name = "terobacter"
description = "Standalone, self-contained Enterobacter isolate classification"
version = "0.0.0"
authors = ["Michael Hall <michael@mbh.sh>"]
edition = "2021"
repository = "https://github.com/mbhall88/terobacter"
homepage = "https://github.com/mbhall88/terobacter"
readme = "README.md"
keywords = ["bioinformatics", "enterobacter", "classification", "ani", "taxonomy"]
categories = ["science", "command-line-utilities"]
license-file = "LICENSE"
# Public release is a later author decision, so accidental publication is blocked.
publish = false

[features]
# Evaluation-only operations. Built only on request; never part of a default build or install.
dev = []

[lib]
name = "terobacter"
path = "src/lib.rs"

[[bin]]
name = "tero"
path = "src/bin/tero.rs"

[[bin]]
name = "terobacter"
path = "src/bin/terobacter.rs"

[[bin]]
name = "terobacter-dev"
path = "src/bin/terobacter-dev.rs"
required-features = ["dev"]

[dependencies]
num-bigint = "0.4.8"
skani = { path = "vendor/skani" }
bincode = "1.3.3"
needletail = "0.7.3"
rayon = "1.11.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
# arbitrary_precision keeps a number's literal text, so evidence with more than two decimals
# is rejected instead of being rounded through an f64.
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
thiserror = "2.0.21"
libc = "0.2.190"
sha2 = "0.10.9"

[build-dependencies]
cc = "1.4.0"
sha2 = "0.10.9"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[profile.release]
strip = true   # https://github.com/johnthagen/min-sized-rust?tab=readme-ov-file#strip-symbols-from-binary
debug = false
lto = true # https://doc.rust-lang.org/cargo/reference/profiles.html

# Keep test builds smaller; CARGO_PROFILE_TEST_DEBUG can restore symbols for debugging.
[profile.test]
debug = 0
